# The nightly per-layer gate search on public text (brain C, budget +3% perplexity), CPU only.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: __CODE__
command: bash run_gate_sweep.sh ${{inputs.master}} ${{inputs.brain}} ${{outputs.results}}
inputs:
  master:
    type: uri_folder
    path: azureml://datastores/lgmasters/paths/e4b-qat
    mode: ro_mount
  brain:
    type: uri_file
    path: azureml://datastores/lgbrains/paths/clean-Q2_K-C.gguf
    mode: download
outputs:
  results:
    type: uri_folder
    path: azureml://datastores/lgresults/paths/ml-gate-sweep/
    mode: rw_mount
environment: azureml:lg-gate-sweep@latest
compute: azureml:lg-meter
identity:
  type: managed
experiment_name: lg-gate-sweep
display_name: per-layer gate search on public text
