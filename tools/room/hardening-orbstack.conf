# Extra walls when the room is built inside an OrbStack Linux machine on a Mac (install.sh adds this block to every
# unit when /opt/orbstack-guest exists). OrbStack shares the Mac into its machines: the Mac's disks read-write
# (/Users, /Volumes, /private, /Applications, /Library, and all of it again under /mnt/mac), the other machines
# (/mnt/machines), and a bridge that runs commands on the Mac itself (/opt/orbstack-guest/bin/macctl, linked as
# `mac`, `open`, `osascript`...). None of that may exist for him: these paths become empty and unreadable.
# (The bridge's vsock line is already shut: PrivateDevices hides /dev/vsock and RestrictAddressFamilies=AF_UNIX
# refuses AF_VSOCK sockets. Tested in escape_test.py, group "mac".)
InaccessiblePaths=-/Users -/Volumes -/private -/Applications -/Library -/mnt -/opt/orbstack-guest -/usr/local/bin
