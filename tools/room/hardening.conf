# Little Guy's room: the walls around his mind (blueprint sandbox-plan-v0.md, Wall 2).
# install.sh pastes this block into every unit that runs as him (the mind itself and the break-out test), so the
# test runs inside exactly the walls he lives in. @...@ values are filled in by install.sh.
User=littleguy-mind
Group=littleguy-mind
SupplementaryGroups=lgmail
UMask=0027

# no keys: he can't gain powers, become root, or run anything setuid
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes

# the house is behind glass: everything read-only, /home and /root gone, only his two folders writable
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/littleguy/room/notebook /var/lib/littleguy/room/outbox
ReadOnlyPaths=/var/lib/littleguy/inbox
InaccessiblePaths=-/var/lib/littleguy-guard
# scratch space is small and in memory (counted against his memory cap), so it cannot fill the disk
# (/var/tmp needs nothing: ProtectSystem=strict already makes it read-only to him). /run is an EMPTY read-only
# folder: every control socket on the machine lives there (system bus, systemd, docker...), and an allow-list of
# nothing travels to the board unchanged, where a deny-list of sockets would not (hiding all of /run/systemd
# instead breaks systemd's own setup: exit 226/NAMESPACE)
# /dev/shm the same way (with PrivateDevices, InaccessiblePaths=-/dev/shm did not hold; tested)
TemporaryFileSystem=/tmp:size=16M,mode=1777 /run:ro /dev/shm:ro
# he can only run the programs he needs (python / the brain); a shell or a copied program won't start
NoExecPaths=/
ExecPaths=@EXECPATHS@

# no phone line out: no network at all, only local mail-slot style sockets inside his own room
PrivateNetwork=yes
IPAddressDeny=any
RestrictAddressFamilies=AF_UNIX

# no plugs: no devices (later, only the NPU device via DeviceAllow=)
PrivateDevices=yes
DevicePolicy=closed

# locks on every other door
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
KeyringMode=private
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @mount @debug @cpu-emulation @obsolete @raw-io @reboot @swap @module @clock
SystemCallErrorNumber=EPERM

# a plate size, not the whole buffet
MemoryMax=@MEMORY@
MemorySwapMax=0
TasksMax=64
CPUQuota=@CPUQUOTA@
LimitNOFILE=256
LimitCORE=0
